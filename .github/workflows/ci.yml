name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get install -y shellcheck
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

      - name: Run shellcheck
        run: just lint

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify scripts are executable
        run: |
          test -x opchain
          test -x install.sh
          test -x uninstall.sh

      - name: Check help and version output
        run: |
          ./opchain --help > /dev/null
          ./opchain --version | grep -q '^opchain '

      - name: Test install/uninstall
        run: |
          ./install.sh
          test -L ~/.local/bin/opchain
          ./uninstall.sh
          test ! -L ~/.local/bin/opchain
