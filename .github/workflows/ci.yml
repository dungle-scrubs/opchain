name: CI
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make lint

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify scripts are executable
        run: |
          test -x opchain
          test -x install.sh
          test -x uninstall.sh

      - name: Test help flag
        run: ./opchain --help

      - name: Test install/uninstall
        run: |
          ./install.sh
          test -L ~/.local/bin/opchain
          ./uninstall.sh
          test ! -L ~/.local/bin/opchain
