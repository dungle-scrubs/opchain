name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The checked steps are platform-neutral (bun lint/typecheck/test/build);
    # the build cross-compiles the darwin-arm64 binaries, so Linux is fine.
    # GitHub-hosted macOS runners bill at 10x the Linux rate - see ticket #38.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install TTY test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
          expect -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Build binary
        run: bun run build
