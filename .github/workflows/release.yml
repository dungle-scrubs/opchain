name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Validate version matches tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          tag_version="${{ steps.release.outputs.tag_name }}"
          tag_version="${tag_version#v}"
          script_version=$(grep '^VERSION=' lib/config.sh | cut -d'"' -f2)
          if [[ "$tag_version" != "$script_version" ]]; then
            echo "Error: tag v$tag_version does not match VERSION=$script_version in lib/config.sh"
            exit 1
          fi
          echo "Version validated: $script_version"
