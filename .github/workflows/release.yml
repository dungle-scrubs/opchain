name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: dungle-scrubs/homebrew-opchain
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Download source tarball and calculate SHA
        run: |
          curl -L -o release.tar.gz "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          SHA=$(shasum -a 256 release.tar.gz | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_ENV

      - name: Update formula
        run: |
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" opchain.rb
          sed -i "s|/v[0-9]*\.[0-9]*\.[0-9]*.tar.gz|/${{ github.ref_name }}.tar.gz|g" opchain.rb

      - name: Push formula update
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add opchain.rb
          if git diff --staged --quiet; then
            echo "No changes to formula"
            exit 0
          fi
          git commit -m "Update opchain to ${{ github.ref_name }}"
          git push
