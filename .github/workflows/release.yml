name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          script_version=$(grep '^VERSION=' lib/config.sh | cut -d'"' -f2)
          if [[ "$tag_version" != "$script_version" ]]; then
            echo "Error: tag $GITHUB_REF_NAME does not match VERSION=$script_version in lib/config.sh"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
